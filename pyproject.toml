[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "npm-semver"
version = "0.1.3"
description = "Semantic version ranges for Python: does 1.4.2 satisfy ^1.2.0?"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["semver", "version", "range", "npm", "caret", "tilde"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/npm-semver"
Issues = "https://github.com/sandeshbagmare/npm-semver/issues"
Changelog = "https://github.com/sandeshbagmare/npm-semver/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/npm_semver"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
